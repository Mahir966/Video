<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #0a0a0a;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* হালকা ব্যাকগ্রাউন্ড গ্লো যাতে বাটনের দিকেই চোখ যায় */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255, 60, 60, 0.15), transparent 60%);
    animation: bgPulse 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes bgPulse {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }

  /* ভিডিও শুরুতে লুকানো */
  #video {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: contain;
    z-index: 5;
  }

  /* বড় অ্যানিমেটেড বাটন */
  #btn {
    position: relative;
    padding: 32px 72px;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffffff;
    background: linear-gradient(135deg, #ff2d2d, #b30000);
    border: none;
    border-radius: 60px;
    cursor: pointer;
    box-shadow:
      0 0 0 0 rgba(255, 45, 45, 0.7),
      0 10px 30px rgba(255, 45, 45, 0.4);
    animation: pulseGlow 1.6s ease-in-out infinite;
    transition: transform 0.15s ease;
    z-index: 2;
  }

  #btn:hover  { transform: scale(1.05); }
  #btn:active { transform: scale(0.97); }

  @keyframes pulseGlow {
    0% {
      box-shadow:
        0 0 0 0 rgba(255, 45, 45, 0.7),
        0 10px 30px rgba(255, 45, 45, 0.4);
      transform: scale(1);
    }
    50% {
      box-shadow:
        0 0 0 25px rgba(255, 45, 45, 0),
        0 10px 40px rgba(255, 45, 45, 0.7);
      transform: scale(1.06);
    }
    100% {
      box-shadow:
        0 0 0 0 rgba(255, 45, 45, 0),
        0 10px 30px rgba(255, 45, 45, 0.4);
      transform: scale(1);
    }
  }

  /* ছোট হিন্ট টেক্সট বাটনের নিচে */
  #hintText {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: fadeHint 2s ease-in-out infinite;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes fadeHint {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 1; }
  }
</style>
</head>
<body>

<button id="btn">▶ CLICK ME</button>
<div id="hintText">Click to see video</div>

<video id="video" src="bhoot.mp4" playsinline preload="auto"></video>

<script>
const btn   = document.getElementById('btn');
const video = document.getElementById('video');
const hint  = document.getElementById('hintText');

btn.addEventListener('click', () => {
  btn.style.display = 'none';
  hint.style.display = 'none';

  video.style.display = 'block';
  video.muted = false;
  video.volume = 1.0;

  video.play().catch(() => {
    video.muted = true;
    video.play();
  });

  // True fullscreen
  const el = document.documentElement;
  if (el.requestFullscreen)            el.requestFullscreen().catch(() => {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen)     el.msRequestFullscreen();
});
</script>

</body>
</html>
